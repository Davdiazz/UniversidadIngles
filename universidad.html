<style>
:root {
  --bg: #060a14;
  --bg-2: #0c111b;
  --panel: rgba(13, 21, 38, 0.82);
  --panel-solid: #0d1526;
  --field: #0a1120;
  --stroke: rgba(255,255,255,0.08);
  --stroke-strong: rgba(255,255,255,0.16);
  --blue-deep: #233ce6;
  --blue: #3b6cf6;
  --blue-sky: #3fc6f5;
  --mint: #8ff3ce;
  --ink: #f3f6fa;
  --ink-soft: #a3b1c6;
  --ink-dim: #5f6d84;
  --danger: #ff6b7a;
  --flow: linear-gradient(100deg, var(--blue-deep), var(--blue-sky) 55%, var(--mint));
  --font-display: 'Space Grotesk', system-ui, sans-serif;
  --font-body: 'Inter', system-ui, sans-serif;
  --radius: 18px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font-body);
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
/* Fondo AutFlow: cuadrícula tenue + aura azul */
body::before {
  content: ""; position: fixed; inset: 0; z-index: -2;
  background-image:
    linear-gradient(rgba(99,140,255,0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(99,140,255,0.06) 1px, transparent 1px);
  background-size: 44px 44px;
  mask-image: radial-gradient(ellipse at 50% 30%, #000 30%, transparent 80%);
}
body::after {
  content: ""; position: fixed; z-index: -1; pointer-events: none;
  width: 900px; height: 900px; left: 50%; top: -380px; transform: translateX(-50%);
  background: radial-gradient(circle, rgba(35,60,230,0.35), rgba(63,198,245,0.10) 45%, transparent 70%);
  filter: blur(10px);
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; -webkit-tap-highlight-color: transparent; }
button:disabled { opacity: .45; cursor: not-allowed; }

/* ── Contenedor tipo app ── */
.app {
  height: 100dvh; display: flex; flex-direction: column;
  max-width: 880px; margin: 0 auto;
}
@media (min-width: 900px) {
  .app {
    height: calc(100dvh - 48px); margin: 24px auto;
    border: 1px solid var(--stroke); border-radius: 28px; overflow: hidden;
    background: rgba(8, 13, 25, 0.6); backdrop-filter: blur(14px);
    box-shadow: 0 30px 80px rgba(0,0,0,.45), 0 0 0 1px rgba(63,198,245,.04), 0 0 120px rgba(35,60,230,.18);
  }
}

/* ── Encabezado ── */
.header {
  display: flex; align-items: center; gap: 12px;
  padding: max(14px, env(safe-area-inset-top)) 16px 14px;
  border-bottom: 1px solid var(--stroke);
  background: linear-gradient(180deg, rgba(12,17,27,.95), rgba(12,17,27,.75));
  backdrop-filter: blur(12px);
  position: relative;
}
.header::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: var(--flow); opacity: .55; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.brand img { width: 38px; height: auto; flex: none; filter: drop-shadow(0 0 12px rgba(63,198,245,.35)); }
.brand-text { min-width: 0; }
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: -.01em; line-height: 1.1; white-space: nowrap; }
.brand-sub { font-size: 12px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-dim); flex: none; }
.dot.on { background: var(--mint); box-shadow: 0 0 8px var(--mint); }
.dot.off { background: var(--danger); }
.level-chip {
  flex: none; font-size: 12.5px; font-weight: 600; padding: 7px 12px; border-radius: 999px;
  border: 1px solid var(--stroke-strong); background: rgba(255,255,255,.03); white-space: nowrap;
}
.level-chip b { background: var(--flow); -webkit-background-clip: text; background-clip: text; color: transparent; }
.icon-ghost {
  flex: none; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
  border: 1px solid var(--stroke-strong); background: rgba(255,255,255,.03); transition: border-color .2s, background .2s;
}
.icon-ghost:hover { border-color: var(--blue-sky); background: rgba(63,198,245,.08); }
.icon-ghost svg { width: 18px; height: 18px; }

/* ── Zona central ── */
.main { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; }

/* Encuesta */
.survey { display: none; flex: 1; overflow-y: auto; padding: 22px 16px calc(22px + var(--safe-b)); }
.survey.active { display: block; }
.survey-card {
  max-width: 560px; margin: 0 auto; padding: 26px 22px;
  border-radius: 24px; border: 1px solid var(--stroke); background: var(--panel);
  box-shadow: 0 20px 60px rgba(0,0,0,.35);
  animation: rise .35s ease;
}
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--blue-sky); margin-bottom: 12px; }
.eyebrow::before { content: ""; width: 18px; height: 2px; border-radius: 2px; background: var(--flow); }
.hero-title { font-family: var(--font-display); font-size: clamp(28px, 7.5vw, 38px); line-height: 1.08; letter-spacing: -.02em; font-weight: 700; }
.grad { background: var(--flow); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero-text { color: var(--ink-soft); font-size: 15.5px; line-height: 1.6; margin: 14px 0 20px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 22px; }
.stat { padding: 12px 10px; border-radius: 14px; border: 1px solid var(--stroke); background: rgba(255,255,255,.02); text-align: center; }
.stat b { display: block; font-family: var(--font-display); font-size: 19px; }
.stat span { font-size: 11.5px; color: var(--ink-soft); }
.btn-primary {
  width: 100%; padding: 15px 22px; border-radius: 999px; font-weight: 700; font-size: 16px; color: #06101f;
  background: var(--flow); box-shadow: 0 10px 30px rgba(63,198,245,.25); transition: transform .15s, box-shadow .2s;
}
.btn-primary:active { transform: scale(.98); }
.btn-primary:hover { box-shadow: 0 12px 36px rgba(63,198,245,.4); }
.survey-top { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--ink-soft); margin-bottom: 10px; }
.survey-progress { height: 6px; border-radius: 6px; background: rgba(255,255,255,.07); overflow: hidden; margin-bottom: 26px; }
.survey-progress div { height: 100%; background: var(--flow); border-radius: 6px; transition: width .3s ease; }
.survey-word { font-family: var(--font-display); font-size: clamp(38px, 12vw, 54px); font-weight: 700; letter-spacing: -.02em; text-align: center; word-break: break-word; }
.survey-pos { text-align: center; color: var(--blue-sky); font-size: 14px; margin: 4px 0 22px; }
.survey-opts { display: grid; gap: 10px; }
@media (min-width: 560px) { .survey-opts { grid-template-columns: 1fr 1fr; } .survey-opts .no-se { grid-column: 1 / -1; } }
.survey-opts button {
  padding: 16px 18px; border-radius: 16px; text-align: left; font-size: 16px; font-weight: 500;
  border: 1px solid var(--stroke-strong); background: var(--field); transition: border-color .15s, background .15s, transform .1s;
}
.survey-opts button:hover { border-color: var(--blue-sky); background: rgba(63,198,245,.07); }
.survey-opts button:active { transform: scale(.985); }
.survey-opts .no-se { color: var(--ink-soft); border-style: dashed; text-align: center; }

/* Chat */
.messages {
  flex: 1; overflow-y: auto; padding: 18px 14px 10px; display: flex; flex-direction: column; gap: 12px;
  overscroll-behavior: contain; scroll-behavior: smooth;
}
.msg { display: flex; max-width: 100%; animation: rise .25s ease; }
.msg.user { justify-content: flex-end; }
.msg-bubble {
  max-width: min(84%, 620px); padding: 12px 15px; border-radius: 20px; font-size: 15.5px; line-height: 1.55;
  overflow-wrap: anywhere;
}
.msg.bot .msg-bubble { background: var(--panel-solid); border: 1px solid var(--stroke); border-bottom-left-radius: 6px; }
.msg.user .msg-bubble { background: linear-gradient(135deg, var(--blue-deep), var(--blue)); border-bottom-right-radius: 6px; box-shadow: 0 8px 24px rgba(35,60,230,.3); }
.msg.err .msg-bubble { background: rgba(255,107,122,.08); border: 1px solid rgba(255,107,122,.35); color: #ffc2c9; }
.msg-bubble b, .msg-bubble strong { color: #fff; font-weight: 650; }
.msg.bot .msg-bubble b { color: var(--mint); }
.msg-bubble ul { margin: 6px 0 2px 18px; }
.typing { display: none; }
.dots { display: flex; gap: 5px; padding: 3px 2px; }
.dots span { width: 7px; height: 7px; border-radius: 50%; background: var(--blue-sky); animation: blink 1.2s infinite; }
.dots span:nth-child(2) { animation-delay: .2s; } .dots span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }

/* Tarjeta de resultado del modelo */
.result { width: min(92%, 520px); padding: 18px; border-radius: 20px; border: 1px solid rgba(63,198,245,.28);
  background: linear-gradient(160deg, rgba(35,60,230,.18), rgba(13,21,38,.9) 55%); box-shadow: 0 0 40px rgba(35,60,230,.15); }
.result-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
.result-level { font-family: var(--font-display); font-size: 26px; font-weight: 700; text-transform: capitalize; }
.result-score { font-size: 13px; color: var(--ink-soft); white-space: nowrap; }
.result-note { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 12px; }
.result-bars { display: grid; gap: 8px; margin-bottom: 12px; }
.result-bar { display: grid; grid-template-columns: 92px 1fr 40px; gap: 10px; align-items: center; font-size: 13px; text-transform: capitalize; color: var(--ink-soft); }
.result-bar.top { color: var(--ink); font-weight: 600; }
.track { height: 8px; border-radius: 8px; background: rgba(255,255,255,.07); overflow: hidden; }
.fill { height: 100%; border-radius: 8px; background: var(--flow); }
.result-bar span:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.words { display: flex; flex-wrap: wrap; gap: 6px; }
.words span { font-size: 12.5px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--stroke-strong); background: rgba(255,255,255,.03); }

/* Barra de escritura */
.composer {
  padding: 10px 12px calc(12px + var(--safe-b)); border-top: 1px solid var(--stroke);
  background: linear-gradient(0deg, rgba(8,13,25,.98), rgba(8,13,25,.85)); backdrop-filter: blur(12px);
}
.composer-row { display: flex; align-items: flex-end; gap: 8px; max-width: 760px; margin: 0 auto; }
.composer textarea {
  flex: 1; min-width: 0; resize: none; max-height: 130px; padding: 13px 16px; border-radius: 22px;
  font: inherit; font-size: 16px; /* 16px evita el zoom automático en iPhone */
  color: var(--ink); background: var(--field); border: 1px solid var(--stroke-strong); outline: none; line-height: 1.4;
}
.composer textarea:focus { border-color: var(--blue-sky); box-shadow: 0 0 0 3px rgba(63,198,245,.15); }
.composer textarea::placeholder { color: var(--ink-dim); }
.round { flex: none; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; transition: transform .1s, box-shadow .2s, background .2s; }
.round:active { transform: scale(.94); }
.round svg { width: 22px; height: 22px; }
.mic { border: 1px solid var(--stroke-strong); background: rgba(255,255,255,.04); }
.mic.rec { background: var(--danger); border-color: var(--danger); color: #fff; animation: pulse 1.3s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,107,122,.55); } 100% { box-shadow: 0 0 0 16px rgba(255,107,122,0); } }
.send { background: var(--flow); color: #06101f; box-shadow: 0 6px 20px rgba(63,198,245,.3); }
.hint { text-align: center; font-size: 11.5px; color: var(--ink-dim); margin-top: 8px; }
.rec-label { display: none; color: var(--danger); font-weight: 600; }
.recording .rec-label { display: inline; }
.recording .hint-text { display: none; }

@media (max-width: 430px) {
  .header { gap: 8px; padding-left: 12px; padding-right: 12px; }
  .brand { gap: 8px; }
  .brand img { width: 32px; }
  .brand-name { font-size: 17px; }
  .level-chip { padding: 7px 10px; }
  .level-chip .lbl { display: none; }
  .icon-ghost { width: 36px; height: 36px; }
  .round { width: 46px; height: 46px; }
}
.footer-note { font-size: 11px; color: var(--ink-dim); text-align: center; padding: 8px 0 0; }
.footer-note a { color: var(--ink-soft); }
</style>
</head>

<script>
/* ─── A DÓNDE SE CONECTA (fijo en el código) ─── */
// Servidor del tutor publicado con ngrok (lo enciende el comando IAingles en el computador servidor).
const URL_TUTOR = 'https://veneering-uniquely-feminine.ngrok-free.dev';
// Si la página la sirve el propio servidor (link de ngrok o localhost:8080) se usan rutas relativas.
const SERVIDOR = window.TUTOR_SERVIDOR || null;
const chatUrl = SERVIDOR ? SERVIDOR.chatUrl : URL_TUTOR + '/api/tutor';
const STT_URL = SERVIDOR ? SERVIDOR.sttUrl : URL_TUTOR + '/stt/transcribe';
// Evita que la página de aviso de ngrok (cuenta gratis) se meta en las respuestas
const NGROK_HEADERS = { 'ngrok-skip-browser-warning': '1' };

let chatHistory = [];
const ui = document.getElementById('userInput');
const NIVEL_BONITO = { principiante: 'Principiante', basico: 'Básico', intermedio: 'Intermedio', avanzado: 'Avanzado' };

/* ─── INICIO ─── */
window.onload = () => {
  try { encuesta = JSON.parse(localStorage.getItem('encuesta_nivel')); } catch (e) { encuesta = null; }
  const nv = localStorage.getItem('nivel_predicho');
  if (nv) setLevel(nv);
  enableChat();
  if (!encuesta) {
    startSurvey();
  } else {
    addMsg(`¡Hola de nuevo! Tu nivel guardado es **${NIVEL_BONITO[nv] || nv || '—'}**. Escríbeme o háblame para seguir practicando. Si quieres repetir la prueba, toca ↻ arriba.`, false);
  }
  comprobarServidor();
};

// Indicador de conexión (punto verde/rojo junto al nombre)
async function comprobarServidor() {
  const dot = document.getElementById('statusDot');
  try {
    const r = await fetch((SERVIDOR ? '' : URL_TUTOR) + '/modelo/estado', { headers: NGROK_HEADERS });
    const d = await r.json();
    dot.className = 'dot ' + (d.modelo_cargado ? 'on' : 'off');
    dot.title = d.modelo_cargado ? 'Tutor en línea' : 'Modelo de nivel no disponible';
  } catch (e) {
    dot.className = 'dot off';
    dot.title = 'El tutor está apagado en este momento';
  }
}

function setLevel(nivel) {
  document.getElementById('levelPill').innerHTML = '<span class="lbl">Nivel: </span><b>' + escH(NIVEL_BONITO[nivel] || nivel) + '</b>';
}

/* ─── CHAT ─── */
ui.addEventListener('input', () => { ui.style.height = 'auto'; ui.style.height = Math.min(ui.scrollHeight, 130) + 'px'; });
ui.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendMsg(); } });

function enableChat()  { ['userInput','sendBtn','micBtn'].forEach(id => document.getElementById(id).disabled = false); }
function disableChat() { ['userInput','sendBtn','micBtn'].forEach(id => document.getElementById(id).disabled = true); }
function escH(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Markdown sencillo de las respuestas de Groq (**negrita**, *cursiva*, listas, saltos de línea), siempre escapado
function md(text) {
  let h = escH(text)
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/(^|[^*])\*(?!\s)([^*\n]+?)\*(?!\*)/g, '$1<i>$2</i>');
  const lineas = h.split('\n'); let out = ''; let enLista = false;
  for (const l of lineas) {
    const m = l.match(/^\s*(?:[-•]|\d+\.)\s+(.*)/);
    if (m) { if (!enLista) { out += '<ul>'; enLista = true; } out += '<li>' + m[1] + '</li>'; }
    else { if (enLista) { out += '</ul>'; enLista = false; } out += l + '<br>'; }
  }
  if (enLista) out += '</ul>';
  return out.replace(/(<br>)+$/, '');
}

function scrollAbajo() { const m = document.getElementById('messages'); m.scrollTop = m.scrollHeight; }
function addMsg(text, isUser, isErr = false) {
  const msgs = document.getElementById('messages');
  const d = document.createElement('div');
  d.className = 'msg ' + (isUser ? 'user' : isErr ? 'err' : 'bot');
  d.innerHTML = '<div class="msg-bubble">' + (isUser ? escH(text) : md(text)) + '</div>';
  msgs.insertBefore(d, document.getElementById('typing'));
  scrollAbajo();
}
function showTyping() { document.getElementById('typing').style.display = 'flex'; scrollAbajo(); }
function hideTyping() { document.getElementById('typing').style.display = 'none'; }

// Identificador propio de este navegador: la encuesta, el nivel y la sesión de cada estudiante
// viven en SU localStorage, así que dos personas conectadas al tiempo nunca se mezclan.
function getSid() {
  let s = localStorage.getItem('sid');
  if (!s) {
    s = 'sid_' + (window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now() + '_' + Math.random().toString(36).slice(2));
    localStorage.setItem('sid', s);
  }
  return s;
}

async function sendMsg() {
  const msg = ui.value.trim();
  if (!msg) return;
  addMsg(msg, true);
  ui.value = ''; ui.style.height = 'auto';
  disableChat(); showTyping();
  try {
    const body = { message: msg, sessionId: getSid(), conversationHistory: chatHistory };
    // Respuestas de la encuesta: el modelo ML calcula el nivel con ellas
    if (encuesta) body.encuesta = encuesta;
    const res = await fetch(chatUrl, { method: 'POST', headers: { 'Content-Type': 'application/json', ...NGROK_HEADERS }, body: JSON.stringify(body) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const reply = data.response || data.message || data.text || JSON.stringify(data);
    hideTyping();
    if (data.prediccion) showPrediction(data.prediccion);
    addMsg(reply, false, !!(data.servidorError || data.modeloError));
    if (!data.servidorError) chatHistory.push({ role: 'user', content: msg }, { role: 'assistant', content: reply });
  } catch (e) {
    hideTyping();
    addMsg('No pude conectarme con el tutor. Puede que el servidor esté apagado en este momento; intenta de nuevo en un rato. (' + e.message + ')', false, true);
  } finally { enableChat(); ui.focus({ preventScroll: true }); }
}

/* ─── PRUEBA DE NIVEL (para el modelo ML) ─── */
// Palabras del dataset CEFR-J Vocabulary Profile con su traducción (data/banco_vocabulario.csv)
const BANCO_VOCAB = [{"palabra":"bed","pos":"noun","cefr":"A1","traduccion":"cama"},{"palabra":"chair","pos":"noun","cefr":"A1","traduccion":"silla"},{"palabra":"shirt","pos":"noun","cefr":"A1","traduccion":"camisa"},{"palabra":"woman","pos":"noun","cefr":"A1","traduccion":"mujer"},{"palabra":"hill","pos":"noun","cefr":"A1","traduccion":"colina"},{"palabra":"trousers","pos":"noun","cefr":"A1","traduccion":"pantalones"},{"palabra":"wait","pos":"verb","cefr":"A1","traduccion":"esperar"},{"palabra":"finish","pos":"verb","cefr":"A1","traduccion":"terminar"},{"palabra":"heavy","pos":"adjective","cefr":"A1","traduccion":"pesado"},{"palabra":"thin","pos":"adjective","cefr":"A1","traduccion":"delgado"},{"palabra":"clever","pos":"adjective","cefr":"A1","traduccion":"inteligente"},{"palabra":"sunny","pos":"adjective","cefr":"A1","traduccion":"soleado"},{"palabra":"spoon","pos":"noun","cefr":"A2","traduccion":"cuchara"},{"palabra":"envelope","pos":"noun","cefr":"A2","traduccion":"sobre (de carta)"},{"palabra":"weight","pos":"noun","cefr":"A2","traduccion":"peso"},{"palabra":"silver","pos":"noun","cefr":"A2","traduccion":"plata"},{"palabra":"beginning","pos":"noun","cefr":"A2","traduccion":"comienzo"},{"palabra":"drawing","pos":"noun","cefr":"A2","traduccion":"dibujo"},{"palabra":"shut","pos":"verb","cefr":"A2","traduccion":"cerrar"},{"palabra":"hug","pos":"verb","cefr":"A2","traduccion":"abrazar"},{"palabra":"worried","pos":"adjective","cefr":"A2","traduccion":"preocupado"},{"palabra":"loose","pos":"adjective","cefr":"A2","traduccion":"suelto"},{"palabra":"worse","pos":"adjective","cefr":"A2","traduccion":"peor"},{"palabra":"sleepless","pos":"adjective","cefr":"A2","traduccion":"sin dormir"},{"palabra":"praise","pos":"noun","cefr":"B1","traduccion":"elogio"},{"palabra":"guilt","pos":"noun","cefr":"B1","traduccion":"culpa"},{"palabra":"army","pos":"noun","cefr":"B1","traduccion":"ejército"},{"palabra":"blessing","pos":"noun","cefr":"B1","traduccion":"bendición"},{"palabra":"cal djective","cefr":"C1","traduccion":"absorbente"},{"palabra":"vicious","pos":"adjective","cefr":"C1","traduccion":"despiadado"},{"palabra":"unsettling","pos":"adjective","cefr":"C1","traduccion":"perturbador"},{"palabra":"effortless","pos":"adjective","cefr":"C1","traduccion":"sin esfuerzo"},{"palabra":"unwavering","pos":"adjective","cefr":"C1","traduccion":"inquebrantable"},{"palabra":"bauble","pos":"noun","cefr":"C2","traduccion":"baratija"},{"palabra":"hull","pos":"noun","cefr":"C2","traduccion":"casco (de un barco)"},{"palabra":"vermin","pos":"noun","cefr":"C2","traduccion":"alimañas"},{"palabra":"gale","pos":"noun","cefr":"C2","traduccion":"vendaval"},{"palabra":"shoal","pos":"noun","cefr":"C2","traduccion":"banco de peces"},{"palabra":"quiver","pos":"verb","cefr":"C2","traduccion":"temblar"},{"palabra":"mangle","pos":"verb","cefr":"C2","traduccion":"destrozar"},{"palabra":"brim","pos":"verb","cefr":"C2","traduccion":"rebosar"},{"palabra":"elated","pos":"adjective","cefr":"C2","traduccion":"eufórico"},{"palabra":"tetchy","pos":"adjective","cefr":"C2","traduccion":"irritable"},{"palabra":"hapless","pos":"adjective","cefr":"C2","traduccion":"desdichado"},{"palabra":"daunting","pos":"adjective","cefr":"C2","traduccion":"intimidante"}];
const PREGUNTAS_POR_NIVEL = { A1: 2, A2: 2, B1: 2, B2: 2, C1: 1, C2: 1 };
const POS_ES = { noun: 'sustantivo', verb: 'verbo', adjective: 'adjetivo' };
const NO_SE = 'No la conozco';

let encuesta = null;          // { respuestas: { palabra: opcionElegida } } — se envía con cada mensaje
let surveyQs = [], surveyIdx = 0, surveyAns = {};
let resultadoPendiente = false;

function mezclar(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function buildSurvey() {
  const qs = [];
  Object.entries(PREGUNTAS_POR_NIVEL).forEach(([nivel, n]) => {
    mezclar(BANCO_VOCAB.filter(p => p.cefr === nivel)).slice(0, n).forEach(p => {
      // Distractores: misma categoría gramatical, preferiblemente del mismo nivel
      const misma = BANCO_VOCAB.filter(o => o.palabra !== p.palabra && o.pos === p.pos);
      const distractores = [...mezclar(misma.filter(o => o.cefr === nivel)), ...mezclar(misma.filter(o => o.cefr !== nivel))]
        .slice(0, 3).map(o => o.traduccion);
      qs.push({ palabra: p.palabra, tipo: POS_ES[p.pos], opciones: mezclar([p.traduccion, ...distractores]) });
    });
  });
  return qs;
}

function setSurveyVisible(on) {
  document.getElementById('survey').classList.toggle('active', on);
  document.getElementById('messages').style.display = on ? 'none' : 'flex';
  document.getElementById('composer').style.display = on ? 'none' : 'block';
}

function startSurvey() {
  surveyQs = buildSurvey(); surveyIdx = 0; surveyAns = {};
  setSurveyVisible(true);
  document.getElementById('surveyCard').innerHTML = `
    <div class="eyebrow">Prueba de nivel</div>
    <h1 class="hero-title">Descubre tu nivel de inglés <span class="grad">en 1 minuto.</span></h1>
    <p class="hero-text">Vas a ver ${surveyQs.length} palabras en inglés, de la más fácil a la más difícil. Elige su significado.
      Si no la conoces, marca <b>"${NO_SE}"</b>: así nuestro modelo de machine learning calcula tu nivel con más precisión.
      Después practicas con tu tutor de IA, escribiendo o hablando.</p>
    <div class="stats">
      <div class="stat"><b>10</b><span>palabras</span></div>
      <div class="stat"><b>ML</b><span>calcula tu nivel</span></div>
      <div class="stat"><b>IA</b><span>tutor a tu medida</span></div>
    </div>
    <button class="btn-primary" onclick="renderQuestion()">Empezar la prueba</button>`;
}

function renderQuestion() {
  const q = surveyQs[surveyIdx];
  const card = document.getElementById('surveyCard');
  card.innerHTML = `
    <div class="survey-top"><span>Pregunta ${surveyIdx + 1} de ${surveyQs.length}</span><span>¿Qué significa?</span></div>
    <div class="survey-progress"><div style="width:${((surveyIdx) / surveyQs.length) * 100}%"></div></div>
    <div class="survey-word">${escH(q.palabra)}</div>
    <div class="survey-pos">${q.tipo}</div>
    <div class="survey-opts"></div>`;
  const opts = card.querySelector('.survey-opts');
  [...q.opciones, NO_SE].forEach(op => {
    const b = document.createElement('button');
    b.textContent = op;
    if (op === NO_SE) b.className = 'no-se';
    b.onclick = () => answerQuestion(q.palabra, op);
    opts.appendChild(b);
  });
  requestAnimationFrame(() => { card.querySelector('.survey-progress div').style.width = ((surveyIdx + 0.001) / surveyQs.length * 100) + '%'; });
}

function answerQuestion(palabra, opcion) {
  surveyAns[palabra] = opcion;
  surveyIdx++;
  if (surveyIdx < surveyQs.length) { renderQuestion(); return; }

  // Prueba terminada: guardamos las respuestas (solo en ESTE navegador) y abrimos la conversación
  encuesta = { respuestas: surveyAns };
  localStorage.setItem('encuesta_nivel', JSON.stringify(encuesta));
  chatHistory = [];
  document.querySelectorAll('#messages .msg:not(.typing)').forEach(m => m.remove());
  resultadoPendiente = true;
  setSurveyVisible(false);
  ui.value = 'Hola, ya terminé la encuesta de vocabulario. ¡Quiero empezar a practicar!';
  sendMsg();
}

function showPrediction(p) {
  setLevel(p.nivel);
  localStorage.setItem('nivel_predicho', p.nivel);
  if (!resultadoPendiente) return;
  resultadoPendiente = false;

  // Mostramos en el chat lo que predijo el modelo ML
  const orden = ['principiante', 'basico', 'intermedio', 'avanzado'];
  const d = document.createElement('div');
  d.className = 'msg bot';
  d.innerHTML = `<div class="result">
    <div class="eyebrow">Resultado del modelo ML</div>
    <div class="result-head"><div class="result-level grad">${escH(NIVEL_BONITO[p.nivel] || p.nivel)}</div><div class="result-score">${escH(p.aciertos)} aciertos</div></div>
    <div class="result-note">Probabilidad de cada nivel según tus respuestas:</div>
    <div class="result-bars">${orden.map(n => {
      const pct = Math.round((p.probabilidades[n] || 0) * 100);
      return `<div class="result-bar ${n === p.nivel ? 'top' : ''}"><span>${NIVEL_BONITO[n]}</span><div class="track"><div class="fill" style="width:${pct}%"></div></div><span>${pct}%</span></div>`;
    }).join('')}</div>
    ${p.palabrasDesconocidas && p.palabrasDesconocidas.length ? `<div class="result-note">Vamos a practicar:</div>
      <div class="words">${p.palabrasDesconocidas.map(w => `<span>${escH(w.palabra)} · ${escH(w.traduccion)}</span>`).join('')}</div>` : ''}
  </div>`;
  document.getElementById('messages').insertBefore(d, document.getElementById('typing'));
  scrollAbajo();
}

/* ─── MICRÓFONO (voz a texto con Whisper en el servidor) ─── */
let mediaRecorder = null, audioChunks = [], isRecording = false;

async function toggleMic() {
  const btn = document.getElementById('micBtn'), composer = document.getElementById('composer');
  if (!isRecording) {
    let stream;
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('el navegador solo permite el micrófono en páginas https://');
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      addMsg('No se pudo usar el micrófono: ' + e.message + '. Revisa que le diste permiso al navegador.', false, true);
      return;
    }
    // iPhone (Safari) graba en mp4; Chrome/Android en webm
    const tipo = ['audio/webm', 'audio/mp4', 'audio/ogg'].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
    mediaRecorder = tipo ? new MediaRecorder(stream, { mimeType: tipo }) : new MediaRecorder(stream);
    audioChunks = [];
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      const mime = mediaRecorder.mimeType || tipo || 'audio/webm';
      const ext = mime.includes('mp4') ? 'mp4' : mime.includes('ogg') ? 'ogg' : 'webm';
      await transcribirYEnviar(new Blob(audioChunks, { type: mime }), ext);
    };
    mediaRecorder.start();
    isRecording = true;
    btn.classList.add('rec'); composer.classList.add('recording');
  } else {
    mediaRecorder.stop();
    isRecording = false;
    btn.classList.remove('rec'); composer.classList.remove('recording');
  }
}

async function transcribirYEnviar(audioBlob, ext) {
  showTyping();
  try {
    const fd = new FormData();
    fd.append('audio', audioBlob, 'audio.' + ext);
    const res = await fetch(STT_URL, { method: 'POST', body: fd, headers: NGROK_HEADERS });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    hideTyping();
    if (!data.text) { addMsg('No te escuché bien 🎧 Intenta de nuevo, un poco más cerca del micrófono.', false, true); return; }
    ui.value = data.text;
    sendMsg();
  } catch (e) {
    hideTyping();
    addMsg('Error transcribiendo el audio: ' + e.message, false, true);
  }
}
